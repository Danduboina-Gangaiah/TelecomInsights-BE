spring.application.name=insights
server.port=9201
spring.profiles.active=dev

#Uncomment these below when using MySQL DB instead of PG, and comment out the PG settings at the bottom
#spring.datasource.url=jdbc:mysql://localhost:3306/springboot
#
#
#spring.datasource.username=root
#
#spring.datasource.password=Apple@1234


# If using manual PG settings instead of docker-compose defaults:
spring.datasource.url=jdbc:postgresql://localhost:5432/telecomDB
spring.datasource.username=telecom
spring.datasource.password=telecom

spring.ai.openai.enabled=false
spring.ai.openai.api-key=your_key
spring.ai.vectorstore.pgvector.enabled=false

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.title=Telecom Insights Generator

