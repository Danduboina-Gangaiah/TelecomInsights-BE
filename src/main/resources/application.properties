# =====================================================
# APPLICATION
# =====================================================

spring.application.name=generator
server.port=9021


# =====================================================
# GEMINI API
# =====================================================

spring.ai.google.genai.api-key=AIzaSyCrjz3DDs02_3E7vDoA8lUe0ekMGaG9Yps

# optional
spring.ai.google.genai.chat.api-key=AIzaSyCrjz3DDs02_3E7vDoA8lUe0ekMGaG9Yps
spring.ai.google.genai.embedding.api-key=AIzaSyCrjz3DDs02_3E7vDoA8lUe0ekMGaG9Yps


# =====================================================
# GEMINI MODEL CONFIG
# =====================================================

spring.ai.google.genai.chat.options.model=gemini-2.5-flash

spring.ai.google.genai.chat.options.temperature=0.2

spring.ai.google.genai.embedding.options.model=text-embedding-004

spring.ai.retry.max-attempts=2


# =====================================================
# VECTOR STORE
# =====================================================

spring.ai.vectorstore.pgvector.dimensions=768

spring.ai.vectorstore.pgvector.initialize-schema=true


# =====================================================
# DATABASE
# =====================================================

spring.datasource.url=jdbc:postgresql://localhost:5433/insight

spring.datasource.username=root

spring.datasource.password=Root@12345

spring.datasource.driver-class-name=org.postgresql.Driver


# =====================================================
# SQL / JPA
# =====================================================

spring.sql.init.mode=never

spring.jpa.defer-datasource-initialization=true

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true


