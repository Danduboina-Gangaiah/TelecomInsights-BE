spring.application.name=generator
server.port=9021

# ===============================
# GEMINI API
# ===============================
spring.ai.google.genai.api-key=AIzaSyCD_s4RnIKZIdA3DcgFfkloML7-Cj98yHY
spring.ai.google.genai.chat.api-key=AIzaSyCD_s4RnIKZIdA3DcgFfkloML7-Cj98yHY
spring.ai.google.genai.embedding.api-key=AIzaSyCD_s4RnIKZIdA3DcgFfkloML7-Cj98yHY
